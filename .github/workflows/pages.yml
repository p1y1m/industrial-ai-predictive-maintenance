name: static-portfolio-demo

# Deliberately manual: publishing requires an explicit workflow dispatch after repository push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify committed offline evidence
        run: test -s frontend/public/data/demo.json
      - name: Build repository-relative static demo
        run: npm run build
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy only after manual dispatch
        id: deployment
        uses: actions/deploy-pages@v5
