[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-pm-intelligence"
version = "0.1.0"
description = "Production-style predictive maintenance intelligence for NASA C-MAPSS turbofan data"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Industrial PM contributors" }]
dependencies = [
  "alembic>=1.13,<2",
  "anyio==3.7.1",
  "fastapi==0.115.6",
  "httpx==0.27.2",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "prometheus-client>=0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "pyyaml>=6.0,<7",
  "python-json-logger>=2.0,<5",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "sqlalchemy>=2.0,<3",
  "starlette==0.41.3",
  "torch>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
mlops = [
  "mlflow>=2.16,<4",
  "shap>=0.46,<1",
]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
  "types-requests>=2.32,<3",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
industrial-pm = "industrial_pm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: tests requiring filesystem or database integration",
  "slow: bounded model training tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["industrial_pm"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["industrial_pm"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["industrial_pm"]
omit = [
  "src/industrial_pm/cli.py",
  "src/industrial_pm/modeling/training.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
