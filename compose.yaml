services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-industrial_pm}
      POSTGRES_USER: ${POSTGRES_USER:-industrial_pm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER}"], interval: 5s, timeout: 3s, retries: 12}
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: docker/backend.Dockerfile}
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-industrial_pm}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-industrial_pm}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ALLOWED_ORIGINS: http://localhost:8080
    volumes: ["./data:/app/data:ro", "./artifacts:/app/artifacts:ro", "./model_registry:/app/model_registry:ro"]
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
  mlflow:
    build: {context: ., dockerfile: docker/backend.Dockerfile}
    command: [mlflow, server, --host, 0.0.0.0, --port, "5000", --backend-store-uri, "postgresql+psycopg://${POSTGRES_USER:-industrial_pm}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-industrial_pm}", --artifacts-destination, /mlartifacts]
    volumes: [mlflow-artifacts:/mlartifacts]
    ports: ["5000:5000"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped
  frontend:
    build: {context: ., dockerfile: docker/frontend.Dockerfile}
    ports: ["8080:8080"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, -qO-, http://localhost:8080/health], interval: 10s, timeout: 3s, retries: 10}
    restart: unless-stopped
volumes: {postgres-data: {}, mlflow-artifacts: {}}
